<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitPlan Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1c2420;--mute:#66736c;--line:#e3dfd5;--brand:#1f6f54;--brand2:#e8f3ee;--warn:#b4570c;--warnbg:#fdf0e1;--bad:#a12626;--badbg:#fbe9e9}
@media(prefers-color-scheme:dark){:root{--bg:#141a17;--card:#1c2420;--ink:#ecf0ed;--mute:#9aa8a0;--line:#2c3832;--brand:#4cc19a;--brand2:#1e3329;--warn:#f0a35a;--warnbg:#33281a;--bad:#f08a8a;--badbg:#3a2020}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:28px;margin:0 0 4px}.sub{color:var(--mute);margin:0 0 24px}
.grid{display:grid;grid-template-columns:340px 1fr;gap:20px}@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}label:first-child{margin-top:0}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{resize:vertical;min-height:60px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{cursor:pointer;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:600;background:var(--brand);color:#fff;width:100%;margin-top:16px}
button.sec{background:var(--brand2);color:var(--brand);width:auto;margin:0 8px 0 0;padding:8px 12px;font-size:14px}
button:disabled{opacity:.55;cursor:wait}
.steps{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.step{flex:1;min-width:130px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px}
.step b{display:block}.step span{color:var(--mute);font-size:13px}
.step.running{border-color:var(--brand);background:var(--brand2)}.step.done{border-color:var(--brand)}
.step.running span::after{content:" ...";}
.notice{padding:12px 14px;border-radius:10px;margin-bottom:14px;font-size:14px}
.notice.warn{background:var(--warnbg);color:var(--warn)}.notice.bad{background:var(--badbg);color:var(--bad)}
details{margin:0 0 14px}summary{cursor:pointer;color:var(--mute);font-size:14px}
.issue{border-left:3px solid var(--line);padding:2px 10px;margin:8px 0;font-size:14px}
.issue.high{border-color:var(--bad)}.issue.medium{border-color:var(--warn)}
.plan table{border-collapse:collapse;width:100%;font-size:14px;display:block;overflow-x:auto}
.plan th,.plan td{border:1px solid var(--line);padding:6px 8px;text-align:left}.plan th{background:var(--brand2)}
.plan h2{margin-top:26px;font-size:20px}
.ask{display:flex;gap:8px;margin-top:8px}.ask input{flex:1}.ask button{width:auto;margin:0}
.answer{background:var(--brand2);border-radius:10px;padding:10px 14px;margin-top:10px;font-size:15px}
.empty{color:var(--mute);text-align:center;padding:60px 10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>FitPlan Pro</h1>
  <p class="sub">Tell us your goal. Three AI agents research it, criticise the draft, then rewrite it into one plan made for you.</p>
  <div class="grid">
    <form class="card" id="form">
      <label for="goal">Goal</label>
      <input id="goal" required minlength="3" placeholder="e.g. run a 10K, swim 1500 m, badminton season prep">
      <div class="row">
        <div><label for="age">Age</label><input id="age" type="number" min="8" max="100" required value="30"></div>
        <div><label for="exp">Experience</label>
          <select id="exp"><option>beginner</option><option>intermediate</option><option>advanced</option></select></div>
      </div>
      <div class="row">
        <div><label for="weeks">Weeks</label><input id="weeks" type="number" min="4" max="24" value="12"></div>
        <div><label for="days">Days / week</label><input id="days" type="number" min="2" max="7" value="4"></div>
      </div>
      <label for="equip">Equipment / access</label>
      <input id="equip" placeholder="gym, pool, treadmill, nothing...">
      <label for="inj">Injuries or health notes</label>
      <textarea id="inj" placeholder="Past injuries, anything that hurts"></textarea>
      <label for="notes">Anything else</label>
      <textarea id="notes" placeholder="Your schedule, sport season, what stopped you before"></textarea>
      <button id="go" type="submit">Build my plan</button>
    </form>

    <div>
      <div class="steps" id="steps" hidden>
        <div class="step" id="s-safety"><b>1. Safety check</b><span>waiting</span></div>
        <div class="step" id="s-research"><b>2. Research agent</b><span>waiting</span></div>
        <div class="step" id="s-critic"><b>3. Critic agent</b><span>waiting</span></div>
        <div class="step" id="s-editor"><b>4. Editor agent</b><span>waiting</span></div>
      </div>
      <div id="notices"></div>
      <div class="card" id="out"><div class="empty">Your plan will appear here.</div></div>
    </div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
let planMd="", age=30;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(md){return DOMPurify.sanitize(marked.parse(md))}
function setStep(id,state,text){const el=$('s-'+id);el.className='step '+state;el.querySelector('span').textContent=text}

$('form').addEventListener('submit',async e=>{
  e.preventDefault();
  age=+$('age').value;
  const body={goal:$('goal').value,age,experience:$('exp').value,weeks:+$('weeks').value,days_per_week:+$('days').value,
    equipment:$('equip').value,injuries:$('inj').value,notes:$('notes').value};
  $('go').disabled=true;$('go').textContent='Working...';$('steps').hidden=false;$('notices').innerHTML='';
  $('out').innerHTML='<div class="empty">The agents are working. This can take a minute or two.</div>';
  for(const s of ['safety','research','critic','editor'])setStep(s,'','waiting');
  try{
    const res=await fetch('/api/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!res.ok){const t=await res.text();throw new Error('Check your inputs ('+res.status+').')}
    const reader=res.body.getReader(),dec=new TextDecoder();let buf='';
    while(true){
      const {done,value}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      let i;while((i=buf.indexOf('\n\n'))>=0){const chunk=buf.slice(0,i);buf=buf.slice(i+2);
        if(chunk.startsWith('data: '))handle(JSON.parse(chunk.slice(6)))}
    }
  }catch(err){$('out').innerHTML='<div class="notice bad">'+esc(err.message)+'</div>'}
  $('go').disabled=false;$('go').textContent='Build my plan';
});

let critique=null;
function handle(ev){
  if(ev.stage==='safety'){
    setStep('safety','done',ev.data.level==='ok'?'passed':ev.data.level);
    if(ev.data.level==='restricted')$('notices').innerHTML='<div class="notice warn"><b>Extra safety rules applied:</b> '+esc(ev.data.flags.join(', '))+'. The plan follows stricter guidance and you should check with a doctor first.</div>';
  }else if(ev.stage==='research'){setStep('research',ev.status==='progress'?'running':ev.status,ev.status==='done'?'draft ready':ev.status==='progress'?ev.message:'researching');}
  else if(ev.stage==='critic'){
    if(ev.status==='done'){critique=ev.data;setStep('critic','done',(ev.data.issues||[]).length+' issue(s) found')}else setStep('critic','running','reviewing');
  }else if(ev.stage==='editor'){setStep('editor',ev.status==='progress'?'running':ev.status,ev.status==='done'?'final plan ready':ev.status==='progress'?ev.message:'rewriting');}
  else if(ev.stage==='error'){$('out').innerHTML='<div class="notice bad">Something went wrong: '+esc(ev.message)+'</div>'}
  else if(ev.stage==='final'){
    planMd=ev.markdown;
    if(ev.status==='hold'){['research','critic','editor'].forEach(s=>setStep(s,'','skipped'));
      $('notices').innerHTML='<div class="notice bad">No plan generated for safety reasons.</div>'}
    let html='';
    if(critique&&critique.issues&&critique.issues.length){
      html+='<details><summary>What the critic found ('+critique.issues.length+')</summary>'+critique.issues.map(i=>
        '<div class="issue '+esc(i.severity)+'"><b>'+esc(i.severity)+' - '+esc(i.where)+':</b> '+esc(i.problem)+'<br><i>Fix:</i> '+esc(i.fix)+'</div>').join('')+'</details>';
    }
    html+='<div class="plan">'+render(planMd)+'</div>';
    if(ev.status!=='hold'){
      html+='<hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><button class="sec" id="dl">Download .md</button><button class="sec" id="cp">Copy</button>'+
        '<div class="ask"><input id="q" placeholder="Ask about your plan, e.g. what if I miss a week?"><button id="askbtn">Ask</button></div><div id="ans"></div>';
    }
    $('out').innerHTML=html;critique=null;
    if(ev.status!=='hold'){
      $('dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([planMd],{type:'text/markdown'}));a.download='fitplan.md';a.click()};
      $('cp').onclick=()=>navigator.clipboard.writeText(planMd);
      $('askbtn').onclick=ask;$('q').addEventListener('keydown',e=>{if(e.key==='Enter')ask()});
    }
  }
}
async function ask(){
  const q=$('q').value.trim();if(!q)return;
  $('askbtn').disabled=true;$('ans').innerHTML='<div class="answer">Thinking...</div>';
  try{
    const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,plan:planMd,age})});
    const j=await r.json();$('ans').innerHTML='<div class="answer">'+render(j.answer||'No answer.')+'</div>';
  }catch(e){$('ans').innerHTML='<div class="notice bad">Could not get an answer.</div>'}
  $('askbtn').disabled=false;
}
</script>
</body>
</html>
